name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: gha-docker-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
